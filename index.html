<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 · Canvas</title>
    <link rel="stylesheet" href="./assets/global.css">

    <style>
        :root {
            --board-bg: saddlebrown;
            --snake-body: green;
            --snake-head: #146b14;
            --enemy-body: #a24bd4;
            --enemy-head: #6f2da8;
            --turret: #59606e;
            --bullet: #ffd166;
            --apple: crimson;
            --power: #00bfff;
            --widen: #ffd21f;
            --ink: rgba(0, 0, 0, 0.75);
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            display: flex;
            justify-content: center;
            padding: 24px 16px 32px;
            -webkit-tap-highlight-color: transparent;
        }

        .game {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .hud {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .hud b {
            color: #000;
            font-variant-numeric: tabular-nums;
        }

        /* 加速剩余时间，只在道具生效时出现 */
        .hud .boost {
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(0, 191, 255, 0.14);
            color: #0080aa;
            font-size: 12px;
            font-weight: 600;
        }

        .hud .boost b {
            color: #006b8f;
        }

        /* 敌人重生倒计时，只在敌人阵亡时出现 */
        .hud .enemy {
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(162, 75, 212, 0.16);
            color: #7d3aa8;
            font-size: 12px;
            font-weight: 600;
        }

        .hud .enemy b {
            color: #5e2d80;
        }

        /* 建造炮塔按钮 */
        .operate .btn.build {
            margin-top: 4px;
            height: 30px;
            font-size: 12px;
            background: rgba(89, 96, 110, 0.16);
            color: #3f4653;
        }

        .operate .btn.build.is-off {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .stage {
            line-height: 0;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
        }

        canvas {
            display: block;
        }

        .operate {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 120px;
            padding: 4px 0;
        }

        .operate .btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .operate .btn:active {
            background-color: saddlebrown;
            color: #fff;
            transition: all .4s ease-in-out;
        }

        .operate .flex {
            width: 100%;
        }

        .desc {
            margin: 0;
            max-width: 320px;
            font-size: 12px;
            line-height: 1.7;
            text-align: center;
            color: var(--ink);
        }
    </style>
</head>

<body>
    <main class="game">
        <div class="hud">
            <span>得分 <b id="score">0</b></span>
            <span>最高 <b id="best">0</b></span>
            <span>场地 <b id="size">15×15</b></span>
            <span>币 <b id="coins">0</b></span>
            <span class="boost" id="boost" hidden>⚡ 加速 <b id="boostLeft">0</b>s</span>
            <span class="enemy" id="enemyTag" hidden>🐍 <b id="enemyLeft">0/1</b></span>
        </div>

        <div class="stage">
            <canvas id="board" aria-label="贪吃蛇棋盘"></canvas>
        </div>

        <div class="operate">
            <div class="btn flex" data-dir="up">上</div>
            <div class="btn" data-dir="left">左</div>
            <div class="btn" data-dir="down">下</div>
            <div class="btn" data-dir="right">右</div>
            <div class="btn build flex" id="buildBtn">建塔 · 身长 −2</div>
        </div>

        <p class="desc">
            玩法：用方向键 / WASD 或屏幕上的方向键，控制绿色蛇（🐍）吃掉红色苹果（🍎）得分；
            吃到蓝色闪电（⚡）可在 30 秒内让步长减半，吃到金色箭头（⤢）可让场地上下左右各拓宽一格；
            紫色是敌人蛇，它也会抢苹果和闪电，撞到它即结束；
            红蛇生来就长（6 节），蓝蛇会朝你发射子弹（打中扣掉对应部位的血）；
            它阵亡后身体会原地掉成一地战利品：绿色 + 加身长，金币 + 加货币；
            按空格（或点「建塔」）消耗 2 节身长 + 1 货币可原地造一座自动开火的炮塔。
        </p>
    </main>

    <script>
        (function () {
            'use strict';

            // ------------------------------ 配置 ------------------------------
            const CELL = 20;        // 每格边长（px）
            const STEP_MS = 500;    // 基础步长：每走一步的间隔

            const START_COLS = 15;  // 初始场地宽（格）
            const START_ROWS = 15;  // 初始场地高（格）
            const MAX_COLS = 25;    // 场地拓宽上限，避免无限变大
            const MAX_ROWS = 25;

            // 加速道具（玩家和敌人蛇都能吃）
            const SPEED_FACTOR = 0.5;       // 拾取后步长乘以这个系数（0.5 = 快一倍）
            const SPEED_MS = 30000;         // 加速持续时间（毫秒）

            // 出生缩放动画 / 尸体掉落
            const SPAWN_ANIM_MS = 260;      // 蛇出现时的缩放动画时长
            const DROP_LIFE_MS = 12000;     // 敌人尸体掉落物的存在时间

            // 蛇身生命：子弹打中的是「哪一节」，不再是整条秒杀
            const SEGMENT_HP = 2;           // 每一节蛇身的生命值
            const HP_REGEN_MS = 5000;       // 每节血量随时间线性回复：5 秒回 1 点
            const DEATH_ANIM_MS = 320;      // 敌人阵亡后缩小淡出的时长
            const MIN_BODY_LEN = 2;         // 蛇身最短长度，砍到比这还短就直接死亡

            // 拓宽道具
            const WIDEN_STEP = 1;           // 每次拓宽：上下左右各加这么多格
            const WIDEN_ANIM_MS = 400;      // 场地放大的动画时长，走的也是下面那条缓动曲线

            // 敌人蛇：数量随着存活时间和得分越来越多
            const ENEMY_STEP_MS = 520;      // 敌人每步间隔（比玩家的基础 500ms 略慢）
            const ENEMY_RESPAWN_MS = 6000;  // 敌人阵亡后多久补位
            const ENEMY_MAX = 5;            // 同时存在的上限

            // 敌人种类
            //   purple 普通紫蛇
            //   red    大红蛇：生来就长（len 就是出生长度）
            //   blue   蓝蛇：会朝玩家开火
            const ENEMY_KINDS = {
                purple: { body: '#a24bd4', head: '#6f2da8', len: 2, stepMs: 520, shoots: false },
                red:    { body: '#d43b2f', head: '#9e2418', len: 6, stepMs: 620, shoots: false },
                blue:   { body: '#3b7fd4', head: '#245a9e', len: 3, stepMs: 560, shoots: true }
            };
            const SPECIAL_RAMP_SEC = 35;    // 存活这么久之后红/蓝蛇才逐渐登场
            const RED_RATE = 0.20;          // 后期红蛇占比
            const BLUE_RATE = 0.30;         // 后期蓝蛇占比
            const ENEMY_SHOOT_MS = 2200;    // 蓝蛇开火间隔
            const ENEMY_SHOOT_RANGE = 9;    // 蓝蛇只在这个距离内开火（格）
            const ENEMY_BULLET_SPEED = 6;   // 敌方子弹速度（格/秒）
            const ENEMY_RAMP_SEC = 20;      // 每存活这么多秒 +1 条
            const ENEMY_RAMP_SCORE = 3;     // 每吃这么多苹果 +1 条
            const ENEMY_SPAWN_GAP = 5;      // 刷新时至少离玩家这么远（曼哈顿距离）
            const ENEMY_TARGET = 'apple';   // 'apple' = 抢苹果 | 'player' = 堵玩家的路

            // 苹果：开局 1 个，越到后期场上同时存在的越多
            const APPLE_BASE = 1;
            const APPLE_MAX = 4;
            const APPLE_RAMP_SEC = 25;      // 每存活这么多秒 +1 个
            const APPLE_RAMP_SCORE = 4;     // 每吃这么多苹果 +1 个

            // 炮塔（消耗自身长度建造）
            const TURRET_COST = 2;          // 建一座塔消耗的身长（节）
            const TURRET_COIN_COST = 1;     // 建一座塔消耗的货币
            const TURRET_MIN_LEN = 4;       // 蛇身至少这么长才能建（建完还剩 >= 2 节）
            const TURRET_MAX = 4;           // 同时存在的上限
            const TURRET_RANGE = 8;         // 射程（格）
            const TURRET_COOLDOWN = 1500;   // 开火间隔（毫秒）
            const BULLET_SPEED = 9;         // 子弹速度（格/秒）

            // 道具表：respawnMs = 被吃掉后多久重新出现
            const POWER_DEFS = {
                speed: { respawnMs: 10000 },
                widen: { respawnMs: 12000 }
            };
            const POWER_KINDS = ['speed', 'widen'];

            // 缓动曲线（蛇身移动、场地放大都用它）：
            //   'easeInOutCubic' 缓入缓出（默认，起步慢、中间快、收尾再慢下来）
            //   'easeInOutQuad'  缓入缓出（幅度更柔和）
            //   'easeInOutSine'  缓入缓出（最平滑，接近匀速但两端仍有加减速）
            //   'linear'         匀速
            const EASING = 'easeInOutCubic';

            const EASE_FNS = {
                linear: function (t) { return t; },
                easeInOutQuad: function (t) {
                    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                },
                easeInOutCubic: function (t) {
                    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                },
                easeInOutSine: function (t) {
                    return -(Math.cos(Math.PI * t) - 1) / 2;
                }
            };

            const ease = EASE_FNS[EASING] || EASE_FNS.linear;

            // 缓入（起步慢、越来越快），给阵亡消散用
            function easeInCubic(t) {
                return t * t * t;
            }

            const COLOR = {
                board: 'saddlebrown',   // 棋盘底色
                body: '#008000',        // 蛇身
                head: '#146b14',        // 蛇头，稍深一点便于分辨
                apple: 'crimson',       // 苹果
                speed: '#00bfff',       // 加速道具
                widen: '#ffd21f',       // 拓宽道具
                turretBase: '#59606e',  // 炮塔底座
                turretBarrel: '#e2e8f0',// 炮管
                turretCore: '#2b3340',  // 炮塔中心
                bullet: '#ffd166',      // 子弹（玩家的炮塔）
                enemyBullet: '#ff4d6d', // 敌方子弹，换个颜色好躲
                dropLen: '#14e0a0',     // 掉落：加身长
                dropCoin: '#ffb703',    // 掉落：加货币
                grid: 'rgba(0, 0, 0, 0.07)',
                mask: 'rgba(0, 0, 0, 0.62)',
                text: '#ffffff'
            };

            const DIRS = {
                up: { x: 0, y: -1 },
                down: { x: 0, y: 1 },
                left: { x: -1, y: 0 },
                right: { x: 1, y: 0 }
            };

            const KEYMAP = {
                ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                w: 'up', s: 'down', a: 'left', d: 'right'
            };

            const BEST_KEY = 'snake.canvas.best';
            const FONT = 'system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif';

            // ------------------------------ 场地 ------------------------------
            // 场地尺寸会随着拓宽道具变大，所以必须是可变的
            let COLS = START_COLS;
            let ROWS = START_ROWS;
            let W = COLS * CELL;
            let H = ROWS * CELL;

            // 放大动画期间的画面偏移（单位 px）：逻辑坐标不动，只挪绘制位置
            let renderOffsetX = 0;
            let renderOffsetY = 0;
            let widenStartAt = 0;     // 放大动画的起始时间，0 表示没有动画
            let widenFromCols = 0;    // 放大前的尺寸，用来做插值
            let widenFromRows = 0;

            // ------------------------------ 画布 ------------------------------
            const canvas = document.getElementById('board');
            const ctx = canvas.getContext('2d');

            // 按设备像素比放大画布，避免高分屏发虚
            const dpr = Math.min(window.devicePixelRatio || 1, 3);

            function setCanvasSize(w, h) {
                W = w;
                H = h;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
            }

            // 直接落到最终尺寸（开局 / 重开时用）
            function resizeCanvas() {
                renderOffsetX = 0;
                renderOffsetY = 0;
                setCanvasSize(COLS * CELL, ROWS * CELL);
            }

            // 放大动画的中间帧：画布尺寸从旧尺寸长到新尺寸，
            // 画面同时从「旧位置」滑到「新位置」，两者共用同一条缓动曲线
            function applyWidenFrame(e) {
                const add = WIDEN_STEP;
                setCanvasSize(
                    Math.round((widenFromCols + add * 2 * e) * CELL),
                    Math.round((widenFromRows + add * 2 * e) * CELL)
                );
                renderOffsetX = -(1 - e) * add * CELL;
                renderOffsetY = -(1 - e) * add * CELL;
            }

            resizeCanvas();

            const scoreEl = document.getElementById('score');
            const bestEl = document.getElementById('best');
            const coinsEl = document.getElementById('coins');
            const sizeEl = document.getElementById('size');
            const boostEl = document.getElementById('boost');
            const boostLeftEl = document.getElementById('boostLeft');
            const enemyTagEl = document.getElementById('enemyTag');
            const enemyLeftEl = document.getElementById('enemyLeft');
            const buildBtnEl = document.getElementById('buildBtn');

            // ------------------------------ 状态 ------------------------------
            let snake;          // 蛇身坐标，头在数组首位
            let snakeHp;        // 每节的生命值，按「从蛇头数第几节」对齐
            let direction;      // 下一步要走的绝对方向（与当前这段动画的终点一致）
            let queue;          // 待生效方向，最多缓存 2 个，避免快速连按丢键
            let apples;         // 场上的苹果 [{ x, y }, ...]
            let powerUps;       // { speed: {x,y}|null, widen: {x,y}|null }
            let powerRespawnAt; // 各道具的重生时间点
            let boostUntil;     // 加速结束的时间点，0 表示未加速
            let stepMs;         // 当前步长（加速时 = STEP_MS * SPEED_FACTOR）
            let enemies;        // 敌人蛇数组 [{ body, dir, acc, stepMs, spawnAt, boostUntil }]
            let enemyRespawns;  // 待补位的重生时间点
            let runStartAt;     // 本局开始时间，用来爬难度
            let coins;          // 货币
            let drops;          // 敌人尸体掉落物 [{ x, y, kind, expireAt }]
            let corpses;        // 正在播阵亡动画的敌人 [{ body, hp, dir, diedAt, lootAt }]
            let playerSpawnAt;  // 玩家出生动画起点
            let nowRef;         // 本帧时间，画动画时用
            let turrets;        // 炮塔 [{ x, y, cooldownUntil }]
            let bullets;        // 子弹 [{ x, y, vx, vy }]，坐标是浮点格
            let buildRequested; // 玩家按下了建塔
            let score;
            let best = readBest();
            let state = 'over'; // 'running' | 'over'
            let acc = 0;        // 当前这一步已经过去的时间
            let last = 0;       // 上一帧时间戳

            // ------------------------------ 存档 ------------------------------
            function readBest() {
                try {
                    return Number(localStorage.getItem(BEST_KEY)) || 0;
                } catch (err) {
                    return 0;   // 隐私模式等场景下 localStorage 不可用
                }
            }

            function saveBest() {
                try {
                    localStorage.setItem(BEST_KEY, String(best));
                } catch (err) {
                    /* 存不了就算了，不影响游戏 */
                }
            }

            // ------------------------------ 工具 ------------------------------
            // 新建一节蛇身
            function cell(x, y) {
                return { x: x, y: y };
            }

            function roundRect(x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
            }

            // 逻辑坐标 -> 画布像素（带上放大动画的偏移）
            function pxOf(cx) { return cx * CELL + renderOffsetX; }
            function pyOf(cy) { return cy * CELL + renderOffsetY; }
            function cxOf(p) { return p.x * CELL + renderOffsetX + CELL / 2; }
            function cyOf(p) { return p.y * CELL + renderOffsetY + CELL / 2; }

            function syncHud() {
                scoreEl.textContent = String(score);
                bestEl.textContent = String(best);
                sizeEl.textContent = COLS + '×' + ROWS;
                coinsEl.textContent = String(coins);
            }

            // 加速剩余时间：整秒向上取整，拾取瞬间显示满 30s
            function syncBoostHud(now) {
                const left = (state === 'running' && boostUntil)
                    ? Math.max(0, Math.ceil((boostUntil - now) / 1000))
                    : 0;
                if (left > 0) {
                    boostLeftEl.textContent = String(left);
                    boostEl.hidden = false;
                } else {
                    boostEl.hidden = true;
                }
            }

            // 换步长时按比例缩放已累积的时间，避免动画进度跳一下
            function setStepMs(next) {
                if (next === stepMs) return;
                acc = acc * (next / stepMs);
                stepMs = next;
            }

            function boosted() {
                return boostUntil > 0;
            }

            function canWiden() {
                return COLS + WIDEN_STEP * 2 <= MAX_COLS && ROWS + WIDEN_STEP * 2 <= MAX_ROWS;
            }

            // ------------------------------ 插值 ------------------------------
            // 当前这一步的进度 0~1，再套上缓动曲线
            function progress() {
                return ease(Math.max(0, Math.min(acc / stepMs, 1)));
            }

            // 这一格有没有苹果（返回下标，没有则 -1）
            function appleIndexAt(x, y) {
                for (let i = 0; i < apples.length; i++) {
                    if (apples[i].x === x && apples[i].y === y) return i;
                }
                return -1;
            }

            function willEatApple(x, y) {
                return appleIndexAt(x, y) !== -1;
            }

            // 下一步走过去会不会变长：苹果或「加身长」掉落物都算
            function willGrowNext() {
                const nx = snake[0].x + direction.x;
                const ny = snake[0].y + direction.y;
                if (willEatApple(nx, ny)) return true;
                const d = dropIndexAt(nx, ny);
                return d !== -1 && drops[d].kind === 'len';
            }

            // 出生缩放动画的进度 0~1
            function spawnScale(at, now) {
                if (at === undefined || at === null || at < 0) return 1;
                return ease(Math.max(0, Math.min((now - at) / SPAWN_ANIM_MS, 1)));
            }

            // 把一条蛇抽象成折线：蛇头沿方向探出 e 格，蛇尾同步缩回 e 格
            function buildPath(body, dir, e, retract) {
                const head = body[0];

                // 蛇头先探出去
                const pts = [{ x: cxOf(head) + dir.x * CELL * e, y: cyOf(head) + dir.y * CELL * e }];

                // 身体各节保持整格不动
                for (let i = 0; i < body.length; i++) {
                    pts.push({ x: cxOf(body[i]), y: cyOf(body[i]) });
                }

                // 尾巴朝前一节缩回；这一步会变长（或游戏已结束）时尾巴原地不动
                const n = body.length;
                if (retract && n >= 2) {
                    const tail = body[n - 1];
                    const prev = body[n - 2];
                    const tx = cxOf(tail);
                    const ty = cyOf(tail);
                    const px = cxOf(prev);
                    const py = cyOf(prev);
                    pts[pts.length - 1] = { x: tx + (px - tx) * e, y: ty + (py - ty) * e };
                }

                return pts;
            }

            // ------------------------------ 绘制 ------------------------------
            function drawBoard() {
                // 场地铺满整块画布：放大过程中画布只露出一部分，四周由这一层补上
                ctx.fillStyle = COLOR.board;
                ctx.fillRect(0, 0, W, H);

                // 网格线跟着画面一起滑动，放大过程中格子才不会和线错位
                ctx.strokeStyle = COLOR.grid;
                ctx.lineWidth = 1;
                ctx.beginPath();

                for (let c = 0; c <= COLS; c++) {
                    const x = pxOf(c);
                    if (x <= 0 || x >= W) continue;
                    const lx = Math.round(x) + 0.5;   // +0.5 让 1px 细线落在像素中心
                    ctx.moveTo(lx, 0);
                    ctx.lineTo(lx, H);
                }
                for (let r = 0; r <= ROWS; r++) {
                    const y = pyOf(r);
                    if (y <= 0 || y >= H) continue;
                    const ly = Math.round(y) + 0.5;
                    ctx.moveTo(0, ly);
                    ctx.lineTo(W, ly);
                }
                ctx.stroke();
            }

            function drawApple() {
                const r = CELL * 0.32;

                for (let i = 0; i < apples.length; i++) {
                    const cx = cxOf(apples[i]);
                    const cy = cyOf(apples[i]);

                    ctx.fillStyle = COLOR.apple;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                    ctx.beginPath();
                    ctx.arc(cx - r * 0.3, cy - r * 0.35, r * 0.28, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 加速道具：蓝色圆底 + 白色闪电
            function drawSpeedItem() {
                const p = powerUps.speed;
                if (!p) return;

                const cx = cxOf(p);
                const cy = cyOf(p);
                const r = CELL * 0.34;

                ctx.fillStyle = COLOR.speed;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(cx, cy, r - 1, 0, Math.PI * 2);
                ctx.stroke();

                const bolt = [
                    [0.12, -0.62], [-0.38, 0.05], [-0.05, 0.05],
                    [-0.14, 0.62], [0.38, -0.05], [0.05, -0.05]
                ];

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                for (let i = 0; i < bolt.length; i++) {
                    const bx = cx + bolt[i][0] * CELL * 0.5;
                    const by = cy + bolt[i][1] * CELL * 0.5;
                    if (i === 0) ctx.moveTo(bx, by);
                    else ctx.lineTo(bx, by);
                }
                ctx.closePath();
                ctx.fill();
            }

            // 拓宽道具：金色圆底 + 四个向外的箭头（正好对应上下左右各拓宽一格）
            function drawWidenItem() {
                const p = powerUps.widen;
                if (!p) return;

                const cx = cxOf(p);
                const cy = cyOf(p);
                const r = CELL * 0.34;

                ctx.fillStyle = COLOR.widen;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(cx, cy, r - 1, 0, Math.PI * 2);
                ctx.stroke();

                const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
                ctx.fillStyle = '#ffffff';

                for (let i = 0; i < dirs.length; i++) {
                    const dx = dirs[i][0];
                    const dy = dirs[i][1];
                    const px = -dy;     // 垂直于箭头方向
                    const py = dx;

                    // 箭杆
                    ctx.beginPath();
                    ctx.moveTo(cx + (dx * 0.06 + px * 0.11) * r, cy + (dy * 0.06 + py * 0.11) * r);
                    ctx.lineTo(cx + (dx * 0.56 + px * 0.11) * r, cy + (dy * 0.56 + py * 0.11) * r);
                    ctx.lineTo(cx + (dx * 0.56 - px * 0.11) * r, cy + (dy * 0.56 - py * 0.11) * r);
                    ctx.lineTo(cx + (dx * 0.06 - px * 0.11) * r, cy + (dy * 0.06 - py * 0.11) * r);
                    ctx.closePath();
                    ctx.fill();

                    // 箭头
                    ctx.beginPath();
                    ctx.moveTo(cx + dx * 0.88 * r, cy + dy * 0.88 * r);
                    ctx.lineTo(cx + (dx * 0.5 + px * 0.3) * r, cy + (dy * 0.5 + py * 0.3) * r);
                    ctx.lineTo(cx + (dx * 0.5 - px * 0.3) * r, cy + (dy * 0.5 - py * 0.3) * r);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            function drawHead(p, dir, color, scale) {
                const s = (scale === undefined) ? 1 : Math.max(0, scale);
                const size = (CELL - 3) * s;
                if (size <= 0.4) return;   // 缩没了就别画

                ctx.fillStyle = color;
                roundRect(p.x - size / 2, p.y - size / 2, size, size, size * 0.35);
                ctx.fill();

                // 眼睛跟随前进方向
                const dx = dir.x;
                const dy = dir.y;
                const px = -dy;
                const py = dx;
                const forward = CELL * 0.15 * s;
                const side = CELL * 0.19 * s;

                for (const sign of [1, -1]) {
                    const ex = p.x + dx * forward + px * side * sign;
                    const ey = p.y + dy * forward + py * side * sign;

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(ex, ey, CELL * 0.1 * s, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#1b1b1b';
                    ctx.beginPath();
                    ctx.arc(ex + dx * CELL * 0.03 * s, ey + dy * CELL * 0.03 * s, CELL * 0.045 * s, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 画一条蛇：身体按节分段描粗线（圆头，接缝处自然连成一体），
            // 每一节用自己血量对应的颜色。
            // 每一节拆成「中点 -> 本节点中心 -> 中点」两小段来画，
            // 保证折线始终穿过格子中心 —— 否则转弯时外角会被斜着切掉。
            // 折线总长（像素）
            function pathLength(pts) {
                let total = 0;
                for (let i = 1; i < pts.length; i++) {
                    const dx = pts[i].x - pts[i - 1].x;
                    const dy = pts[i].y - pts[i - 1].y;
                    total += Math.sqrt(dx * dx + dy * dy);
                }
                return total;
            }

            // 沿折线描出 [from, to] 这段弧长（跨拐角也正确）
            function strokeArc(pts, from, to) {
                let acc = 0;
                let started = false;
                ctx.beginPath();

                for (let i = 1; i < pts.length; i++) {
                    const x0 = pts[i - 1].x;
                    const y0 = pts[i - 1].y;
                    const dx = pts[i].x - x0;
                    const dy = pts[i].y - y0;
                    const len = Math.sqrt(dx * dx + dy * dy);
                    if (len <= 0.0001) continue;

                    const s0 = acc;
                    acc += len;
                    if (acc <= from || s0 >= to) continue;   // 这段不在范围内

                    const t0 = Math.max(0, (from - s0) / len);
                    const t1 = Math.min(1, (to - s0) / len);
                    if (started) {
                        ctx.lineTo(x0 + dx * t0, y0 + dy * t0);
                    } else {
                        ctx.moveTo(x0 + dx * t0, y0 + dy * t0);
                        started = true;
                    }
                    ctx.lineTo(x0 + dx * t1, y0 + dy * t1);
                }

                if (started) ctx.stroke();
            }

            // 画一条蛇：每一节用自己血量对应的颜色。
            // 颜色分界按「离蛇头的弧长」钉死 —— 身体格子在一个步长内是不动的
            // （只有头和尾在伸缩），所以按格子中点分界会让伤口一格一格地跳；
            // 按弧长分界才能让它跟着身体一起平滑地滑过去。
            // segScale < 1 时，每一节各自绕自己的中点收缩（死去时用）
            function strokeSnake(pts, body, hp, bodyColor, headColor, dir, segScale) {
                const s = (segScale === undefined) ? 1 : Math.max(0, segScale);
                if (s <= 0.01) return;

                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                ctx.lineWidth = (CELL - 3) * s;

                const total = pathLength(pts);
                const n = body.length;
                // 圆头会让颜色往两头各溢出半个线宽，导致分界整体后移；
                // 起止各加一个圆头半径抵消掉，分界才落在该在的位置
                const cap = (CELL - 3) * s / 2;

                for (let i = 0; i < n; i++) {
                    ctx.strokeStyle = segmentColor(bodyColor, hp[i]);

                    const a = ((i === 0) ? 0 : (i - 0.5) * CELL) + cap;
                    const b = ((i === n - 1) ? total : (i + 0.5) * CELL) + cap;
                    const mid = (a + b) / 2;
                    strokeArc(pts, mid + (a - mid) * s, mid + (b - mid) * s);
                }

                ctx.shadowBlur = 0;   // 光晕只加在身体上
                drawHead(pts[0], dir, segmentColor(headColor, hp[0]), s);
            }

            // 以某个点为轴做缩放，用来做出生动画
            function withSpawnScale(px, py, s, draw) {
                if (s >= 0.999) {
                    draw();
                    return;
                }
                if (s <= 0.02) return;
                ctx.save();
                ctx.translate(px, py);
                ctx.scale(s, s);
                ctx.translate(-px, -py);
                draw();
                ctx.restore();
            }

            // 加速光晕：整条蛇一次描完来投阴影。
            // 逐节描边的话每一节都会各投一圈，光晕会被后画上去的身体切成一截一截 —— 只留最外面完整的一圈。
            function drawBoostGlow(pts, color) {
                if (pts.length === 0) return;

                ctx.save();
                ctx.shadowColor = 'rgba(0, 191, 255, 0.95)';
                ctx.shadowBlur = 12;
                ctx.strokeStyle = color;
                ctx.fillStyle = color;      // 用身体本色，之后被真正的蛇身盖掉，接缝处不会露边
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                ctx.lineWidth = CELL - 3;

                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.stroke();

                // 头是个圆角方，光晕那条线盖不满四个角，这里补上
                const size = CELL - 3;
                roundRect(pts[0].x - size / 2, pts[0].y - size / 2, size, size, size * 0.35);
                ctx.fill();

                ctx.restore();
            }

            function drawSnake() {
                const head = snake[0];
                const s = spawnScale(playerSpawnAt, nowRef);
                const pts = buildPath(snake, direction, progress(), state === 'running' && !willGrowNext());

                withSpawnScale(cxOf(head), cyOf(head), s, function () {
                    if (boosted()) drawBoostGlow(pts, COLOR.body);
                    strokeSnake(pts, snake, snakeHp, COLOR.body, COLOR.head, direction);
                });
            }

            // 阵亡动画：每一节各自绕自己的中点「缓入」缩到 0
            function drawCorpses() {
                for (let i = 0; i < corpses.length; i++) {
                    const c = corpses[i];
                    const t = Math.min(1, (nowRef - c.diedAt) / DEATH_ANIM_MS);
                    if (t >= 1 || c.body.length === 0) continue;

                    const def = enemyDef(c);
                    const pts = buildPath(c.body, c.dir, 0, false);
                    strokeSnake(pts, c.body, c.hp, def.body, def.head, c.dir,
                        1 - easeInCubic(t));
                }
            }

            function drawEnemy() {
                for (let i = 0; i < enemies.length; i++) {
                    const en = enemies[i];
                    if (en.body.length === 0) continue;

                    const e = ease(Math.max(0, Math.min(en.acc / en.stepMs, 1)));
                    const head = en.body[0];

                    // 下一步会变长（抢到苹果）的话，这一步尾巴不缩
                    const retract = !willEatApple(head.x + en.dir.x, head.y + en.dir.y);

                    const def = enemyDef(en);
                    const pts = buildPath(en.body, en.dir, e, retract);
                    withSpawnScale(cxOf(head), cyOf(head), spawnScale(en.spawnAt, nowRef), function () {
                        // 敌人吃到闪电也一样发光
                        if (en.boostUntil > 0) drawBoostGlow(pts, def.body);
                        strokeSnake(pts, en.body, en.hp, def.body, def.head, en.dir);
                    });
                }
            }

            // '#rrggbb' -> [r, g, b]
            function rgbOf(hex) {
                return [
                    parseInt(hex.slice(1, 3), 16),
                    parseInt(hex.slice(3, 5), 16),
                    parseInt(hex.slice(5, 7), 16)
                ];
            }

            // 部位的颜色直接由剩余血量决定：满血是本色，血越少压得越暗
            function segmentColor(baseHex, hp) {
                const max = SEGMENT_HP;
                const h = (hp === undefined) ? max : Math.max(0, Math.min(hp, max));
                let t = (max <= 1) ? 0 : 1 - (h - 1) / (max - 1);   // 满血 0 -> 血见底 1
                t = Math.max(0, Math.min(t, 1));
                if (t <= 0) return baseHex;

                const c = rgbOf(baseHex);
                const k = 1 - t * 0.72;    // 最暗时压到本色的 28%
                return 'rgb(' + Math.round(c[0] * k) + ',' + Math.round(c[1] * k) + ',' + Math.round(c[2] * k) + ')';
            }

            // 敌人尸体掉落物：绿色加号 = 加身长，金币 = 加货币
            function drawDrops() {
                for (let i = 0; i < drops.length; i++) {
                    const d = drops[i];
                    const cx = cxOf(d);
                    const cy = cyOf(d);
                    const r = CELL * 0.3;

                    // 快消失时闪烁提醒
                    const left = d.expireAt - nowRef;
                    if (left < 3000) {
                        ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(left / 120));
                    }

                    ctx.fillStyle = (d.kind === 'len') ? COLOR.dropLen : COLOR.dropCoin;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    if (d.kind === 'len') {
                        const t = r * 0.2;
                        ctx.fillRect(cx - t, cy - r * 0.55, t * 2, r * 1.1);
                        ctx.fillRect(cx - r * 0.55, cy - t, r * 1.1, t * 2);
                    } else {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(cx, cy, r * 0.62, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(cx, cy, r * 0.2, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.globalAlpha = 1;
                }
            }

            function drawOverlay() {
                ctx.fillStyle = COLOR.mask;
                ctx.fillRect(0, 0, W, H);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.fillStyle = COLOR.text;
                ctx.font = 'bold 22px ' + FONT;
                ctx.fillText('游戏结束', W / 2, H / 2 - 26);

                ctx.font = '15px ' + FONT;
                ctx.fillText('得分为 ' + score, W / 2, H / 2 + 6);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.font = '12px ' + FONT;
                ctx.fillText('按空格 / 回车重新开始', W / 2, H / 2 + 38);
            }

            function render() {
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                drawBoard();
                drawApple();
                drawSpeedItem();
                drawWidenItem();
                drawDrops();
                drawTurrets();
                drawBullets();
                drawCorpses();
                drawEnemy();
                drawSnake();
                if (state === 'over') drawOverlay();
            }

            // ------------------------------ 玩法 ------------------------------
            // 收集没有被蛇、苹果、道具占用的格子
            function freeCells() {
                const taken = new Set(snake.map(function (s) { return s.y * COLS + s.x; }));
                for (let e = 0; e < enemies.length; e++) {
                    const body = enemies[e].body;
                    for (let i = 0; i < body.length; i++) {
                        taken.add(body[i].y * COLS + body[i].x);
                    }
                }
                for (let i = 0; i < turrets.length; i++) {
                    taken.add(turrets[i].y * COLS + turrets[i].x);
                }
                for (let i = 0; i < drops.length; i++) {
                    taken.add(drops[i].y * COLS + drops[i].x);
                }
                for (let i = 0; i < apples.length; i++) {
                    taken.add(apples[i].y * COLS + apples[i].x);
                }
                for (let i = 0; i < POWER_KINDS.length; i++) {
                    const p = powerUps[POWER_KINDS[i]];
                    if (p) taken.add(p.y * COLS + p.x);
                }
                const out = [];
                for (let i = 0; i < COLS * ROWS; i++) {
                    if (!taken.has(i)) out.push(i);
                }
                return out;
            }

            function pickCell(free) {
                if (free.length === 0) return null;   // 场地已满
                const i = free[Math.floor(Math.random() * free.length)];
                return { x: i % COLS, y: Math.floor(i / COLS) };
            }

            // 放一个苹果；放不下就返回 false
            function spawnApple() {
                // 先收集所有空格再随机取一个：场地被填满时也不会像递归那样死循环
                const spot = pickCell(freeCells());
                if (!spot) return false;
                apples.push(spot);
                return true;
            }

            // 当前应该同时存在几个苹果：存活时间 / 得分取较大者，越后期越多
            function appleTargetCount(now) {
                const byTime = APPLE_BASE + Math.floor(Math.max(0, now - runStartAt) / (APPLE_RAMP_SEC * 1000));
                const byScore = APPLE_BASE + Math.floor(score / APPLE_RAMP_SCORE);
                return Math.min(Math.max(byTime, byScore), APPLE_MAX);
            }

            // 离某点最近的苹果（敌人 AI 用）
            function nearestApple(p) {
                let best = null;
                let bestD = Infinity;
                for (let i = 0; i < apples.length; i++) {
                    const d = Math.abs(apples[i].x - p.x) + Math.abs(apples[i].y - p.y);
                    if (d < bestD) {
                        bestD = d;
                        best = apples[i];
                    }
                }
                return best;
            }

            function spawnPowerUp(kind) {
                if (kind === 'widen' && !canWiden()) return;   // 到上限就不再出现
                powerUps[kind] = pickCell(freeCells());
            }

            // 吃下拓宽道具：上下左右各加一格。逻辑坐标一次性改好，
            // 画面变化交给 applyWidenFrame 做缓入缓出
            function widenField(now) {
                if (!canWiden()) return;

                const add = WIDEN_STEP;
                widenFromCols = COLS;
                widenFromRows = ROWS;

                COLS += add * 2;
                ROWS += add * 2;

                // 左边、上面各多了一格，所以已有坐标统一 +add
                for (let i = 0; i < snake.length; i++) {
                    snake[i].x += add;
                    snake[i].y += add;
                }
                for (let i = 0; i < apples.length; i++) {
                    apples[i].x += add;
                    apples[i].y += add;
                }
                for (let i = 0; i < POWER_KINDS.length; i++) {
                    const p = powerUps[POWER_KINDS[i]];
                    if (p) {
                        p.x += add;
                        p.y += add;
                    }
                }
                for (let e = 0; e < enemies.length; e++) {
                    const body = enemies[e].body;
                    for (let i = 0; i < body.length; i++) {
                        body[i].x += add;
                        body[i].y += add;
                    }
                }
                for (let i = 0; i < turrets.length; i++) {
                    turrets[i].x += add;
                    turrets[i].y += add;
                }
                for (let i = 0; i < drops.length; i++) {
                    drops[i].x += add;
                    drops[i].y += add;
                }
                for (let i = 0; i < bullets.length; i++) {
                    bullets[i].x += add;
                    bullets[i].y += add;
                }

                widenStartAt = now;   // 由主循环逐帧推进动画
                syncHud();
            }

            function reset() {
                COLS = START_COLS;
                ROWS = START_ROWS;
                widenStartAt = 0;
                resizeCanvas();

                snake = [cell(5, 5), cell(5, 6)];   // 初始蛇身
                snakeHp = [SEGMENT_HP, SEGMENT_HP];
                direction = DIRS.right;
                queue = [];
                score = 0;

                // 道具与加速状态归零
                boostUntil = 0;
                stepMs = STEP_MS;
                powerUps = { speed: null, widen: null };
                powerRespawnAt = { speed: 0, widen: 0 };
                apples = [];

                enemies = [];
                enemyRespawns = [];
                runStartAt = -1;
                playerSpawnAt = -1;
                coins = 0;
                drops = [];
                corpses = [];
                turrets = [];
                bullets = [];
                buildRequested = false;

                spawnApple();
                for (let i = 0; i < POWER_KINDS.length; i++) {
                    spawnPowerUp(POWER_KINDS[i]);
                }
                spawnEnemy(0);
                syncHud();
            }

            function start() {
                reset();
                state = 'running';
                acc = 0;
                last = performance.now();
            }

            function turn(name) {
                if (state !== 'running') return;

                const dir = DIRS[name];
                if (!dir) return;

                // 以最后一个待生效方向为准来判断，避免同一帧连按导致掉头
                const ref = queue.length ? queue[queue.length - 1] : direction;
                if (dir.x === ref.x && dir.y === ref.y) return;     // 同方向，忽略
                if (dir.x === -ref.x && dir.y === -ref.y) return;   // 禁止 180° 掉头
                if (queue.length >= 2) return;

                queue.push(dir);
            }

            // 拾取道具
            function pickPowerUp(kind, now) {
                powerUps[kind] = null;
                powerRespawnAt[kind] = now + POWER_DEFS[kind].respawnMs;

                if (kind === 'speed') {
                    // 步长乘以 SPEED_FACTOR，并从现在起持续 SPEED_MS
                    setStepMs(STEP_MS * SPEED_FACTOR);
                    boostUntil = now + SPEED_MS;   // 重复拾取只刷新时间，不越叠越快
                } else if (kind === 'widen') {
                    widenField(now);
                }
            }

            function step(now) {
                // direction 在上一步落子后就定好了，所以蛇头动画的终点就是这里的落点，
                // 转弯时不会出现「头已经伸到 A 格、逻辑却走到 B 格」的跳变
                const head = cell(snake[0].x + direction.x, snake[0].y + direction.y);

                // 撞墙
                if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
                    return gameOver();
                }

                const eatIdx = appleIndexAt(head.x, head.y);
                const willEat = eatIdx !== -1;

                // 这一帧会吃到哪个道具（苹果和道具不会在同一格）
                let hitPower = null;
                for (let i = 0; i < POWER_KINDS.length; i++) {
                    const p = powerUps[POWER_KINDS[i]];
                    if (p && p.x === head.x && p.y === head.y) {
                        hitPower = POWER_KINDS[i];
                        break;
                    }
                }

                // 脚下的掉落物：绿色加身长，金币加货币
                const dropIdx = dropIndexAt(head.x, head.y);
                const dropKind = (dropIdx === -1) ? null : drops[dropIdx].kind;
                const willGrow = willEat || dropKind === 'len';

                // 这一帧不会移动的那截尾巴不参与碰撞判定（尾巴正好让开）
                const body = willGrow ? snake : snake.slice(0, snake.length - 1);
                for (let i = 0; i < body.length; i++) {
                    if (body[i].x === head.x && body[i].y === head.y) return gameOver();
                }

                // 撞到任何一条敌人蛇（整条都算，包括尾巴）
                if (enemyAt(head.x, head.y, null)) return gameOver();

                // 撞到自己造的炮塔
                if (occupiedByTurret(head.x, head.y)) return gameOver();

                snake.unshift(head);
                if (willGrow) {
                    // 变长时给尾巴补一格血。血量按「从蛇头数第几节」对齐，
                    // 所以蛇往前走时，受伤的那一节会跟着身体一起前进
                    snakeHp.push(SEGMENT_HP);
                } else {
                    snake.pop();   // 道具 / 金币不增加长度
                }

                if (willEat) {
                    apples.splice(eatIdx, 1);
                    score += 1;
                    spawnApple();   // 吃掉一个补一个
                    syncHud();
                }

                if (dropIdx !== -1) {
                    drops.splice(dropIdx, 1);
                    if (dropKind === 'coin') {
                        coins += 1;
                        syncHud();
                    }
                }

                if (hitPower) pickPowerUp(hitPower, now);

                // 落子之后再取下一个方向，下一段动画才能提前知道该往哪拐
                if (queue.length) direction = queue.shift();
            }

            function gameOver() {
                state = 'over';
                acc = stepMs;       // 停在冲到终点的那一帧，避免蛇头弹回
                if (score > best) {
                    best = score;
                    saveBest();
                }
                syncHud();
            }

            // ------------------------------ 敌人蛇 ------------------------------
            function occupiedByPlayer(x, y) {
                for (let i = 0; i < snake.length; i++) {
                    if (snake[i].x === x && snake[i].y === y) return true;
                }
                return false;
            }

            // 某条蛇自己的身体；skipTail = 尾巴这一步会让开，不算障碍
            function ownBodyAt(body, x, y, skipTail) {
                const n = body.length;
                for (let i = 0; i < n; i++) {
                    if (skipTail && i === n - 1) continue;
                    if (body[i].x === x && body[i].y === y) return true;
                }
                return false;
            }

            // 命中哪一节（没命中返回 -1）
            function bodyIndexAt(body, x, y) {
                for (let i = 0; i < body.length; i++) {
                    if (body[i].x === x && body[i].y === y) return i;
                }
                return -1;
            }

            // 给某一节扣血。返回 true 表示这一击把整条蛇打死了
            function damageBody(body, hp, index, now) {
                if (index < 0 || index >= body.length) return false;

                hp[index] -= 1;
                if (hp[index] > 0) return false;   // 只是受伤，还没断

                // 生命见底：连它自己带后面所有节一起拆掉。
                // 如果拆完会比最短长度还短，就直接判定死亡
                if (index < MIN_BODY_LEN) return true;

                const lost = body.splice(index);
                hp.length = index;
                dropLoot(lost, now);
                return false;
            }

            // 有没有别的敌人占着这一格（except 用来排除自己）
            function enemyAt(x, y, except) {
                for (let e = 0; e < enemies.length; e++) {
                    if (enemies[e] === except) continue;
                    if (ownBodyAt(enemies[e].body, x, y, false)) return true;
                }
                return false;
            }

            const STEP_DIRS = [
                { x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }
            ];

            // 给某条敌人算一张障碍图：玩家、炮塔、其他敌人整条都算，
            // 它自己只有尾巴不算（下一步尾巴会让开）
            function buildBlockMap(self) {
                const blocked = new Uint8Array(COLS * ROWS);

                for (let i = 0; i < snake.length; i++) {
                    blocked[snake[i].y * COLS + snake[i].x] = 1;
                }
                for (let i = 0; i < turrets.length; i++) {
                    blocked[turrets[i].y * COLS + turrets[i].x] = 1;
                }
                for (let e = 0; e < enemies.length; e++) {
                    const other = enemies[e];
                    const n = other.body.length;
                    for (let i = 0; i < n; i++) {
                        if (other === self && i === n - 1) continue;
                        blocked[other.body[i].y * COLS + other.body[i].x] = 1;
                    }
                }
                return blocked;
            }

            // 敌人的走法：能靠近目标就靠近，但绝不把自己关进死胡同
            function enemyChooseDir(self) {
                const blocked = buildBlockMap(self);
                const free = function (x, y) {
                    return x >= 0 && y >= 0 && x < COLS && y < ROWS && !blocked[y * COLS + x];
                };

                // 从某一格出发能走到的空地数量，用来判断会不会把自己憋死
                function freeSpace(sx, sy) {
                    if (!free(sx, sy)) return 0;
                    const seen = new Uint8Array(COLS * ROWS);
                    const start = sy * COLS + sx;
                    seen[start] = 1;
                    const queue = [start];
                    let count = 0;
                    for (let qi = 0; qi < queue.length; qi++) {
                        const cur = queue[qi];
                        count += 1;
                        const cx = cur % COLS;
                        const cy = Math.floor(cur / COLS);
                        for (let k = 0; k < STEP_DIRS.length; k++) {
                            const nx = cx + STEP_DIRS[k].x;
                            const ny = cy + STEP_DIRS[k].y;
                            if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
                            const ni = ny * COLS + nx;
                            if (seen[ni] || !free(nx, ny)) continue;
                            seen[ni] = 1;
                            queue.push(ni);
                        }
                    }
                    return count;
                }

                const head = self.body[0];
                const options = [];

                for (let k = 0; k < STEP_DIRS.length; k++) {
                    const d = STEP_DIRS[k];
                    if (d.x === -self.dir.x && d.y === -self.dir.y) continue;   // 不能掉头
                    const nx = head.x + d.x;
                    const ny = head.y + d.y;
                    if (!free(nx, ny)) continue;
                    options.push({ dir: d, x: nx, y: ny });
                }

                if (options.length === 0) return self.dir;   // 走投无路

                // 目标：默认抢苹果；也可以改成堵玩家下一步要走的格子
                const target = (ENEMY_TARGET === 'player')
                    ? { x: snake[0].x + direction.x, y: snake[0].y + direction.y }
                    : nearestApple(head);

                if (target) {
                    // 从目标点反推距离，每条蛇各搜一次
                    const dist = new Array(COLS * ROWS).fill(-1);
                    const start = target.y * COLS + target.x;
                    dist[start] = 0;
                    const queue = [start];
                    for (let qi = 0; qi < queue.length; qi++) {
                        const cur = queue[qi];
                        const cx = cur % COLS;
                        const cy = Math.floor(cur / COLS);
                        for (let k = 0; k < STEP_DIRS.length; k++) {
                            const nx = cx + STEP_DIRS[k].x;
                            const ny = cy + STEP_DIRS[k].y;
                            if (!free(nx, ny)) continue;
                            const ni = ny * COLS + nx;
                            if (dist[ni] !== -1) continue;
                            dist[ni] = dist[cur] + 1;
                            queue.push(ni);
                        }
                    }

                    let best = null;
                    let bestD = Infinity;
                    for (let i = 0; i < options.length; i++) {
                        const d = dist[options[i].y * COLS + options[i].x];
                        if (d === -1) continue;
                        if (d < bestD) {
                            bestD = d;
                            best = options[i];
                        }
                    }
                    // 走这一步之后还得有足够空地，不然就是自寻死路
                    if (best && freeSpace(best.x, best.y) >= self.body.length) {
                        return best.dir;
                    }
                }

                // 够不到目标，就往空地最大的一边逃
                let fallback = options[0];
                let bestSpace = -1;
                for (let i = 0; i < options.length; i++) {
                    const space = freeSpace(options[i].x, options[i].y);
                    if (space > bestSpace) {
                        bestSpace = space;
                        fallback = options[i];
                    }
                }
                return fallback.dir;
            }

            // 难度：存活越久 / 吃得越多，同时存在的敌人越多
            function enemyTargetCount(now) {
                const byTime = 1 + Math.floor(Math.max(0, now - runStartAt) / (ENEMY_RAMP_SEC * 1000));
                const byScore = 1 + Math.floor(score / ENEMY_RAMP_SCORE);
                return Math.min(Math.max(byTime, byScore), ENEMY_MAX);
            }

            function enemyDef(en) {
                return ENEMY_KINDS[en.kind] || ENEMY_KINDS.purple;
            }

            // 越到后期，红蛇 / 蓝蛇出现得越多
            function pickEnemyKind(now) {
                const ramp = Math.min(1, Math.max(0, (now - runStartAt) / (SPECIAL_RAMP_SEC * 1000)));
                const r = Math.random();
                if (r < RED_RATE * ramp) return 'red';
                if (r < (RED_RATE + BLUE_RATE) * ramp) return 'blue';
                return 'purple';
            }

            function spawnEnemy(now) {
                const kind = pickEnemyKind(now);
                const def = ENEMY_KINDS[kind];

                const free = freeCells();
                if (free.length < def.len + 1) return false;

                const playerHead = snake[0];
                for (let tries = 0; tries < 200; tries++) {
                    const i = free[Math.floor(Math.random() * free.length)];
                    const head = cell(i % COLS, Math.floor(i / COLS));

                    // 别在玩家脸上刷出来
                    if (Math.abs(head.x - playerHead.x) +
                        Math.abs(head.y - playerHead.y) < ENEMY_SPAWN_GAP) continue;

                    for (let k = 0; k < STEP_DIRS.length; k++) {
                        const d = STEP_DIRS[k];

                        // 整条身体都得躺在空格里 —— 大红蛇生来就长，所以这一步要一次摆下 len 节
                        const body = [head];
                        let ok = true;
                        for (let q = 1; q < def.len; q++) {
                            const bx = head.x - d.x * q;
                            const by = head.y - d.y * q;
                            if (bx < 0 || by < 0 || bx >= COLS || by >= ROWS ||
                                free.indexOf(by * COLS + bx) === -1) { ok = false; break; }
                            body.push(cell(bx, by));
                        }
                        if (!ok) continue;

                        // 头朝的那一边也得迈得出去，否则它第一步就撞墙
                        const fx = head.x + d.x;
                        const fy = head.y + d.y;
                        if (fx < 0 || fy < 0 || fx >= COLS || fy >= ROWS) continue;
                        if (free.indexOf(fy * COLS + fx) === -1) continue;

                        enemies.push({
                            kind: kind,
                            body: body, dir: d, acc: 0,
                            hp: body.map(function () { return SEGMENT_HP; }),
                            baseStepMs: def.stepMs, stepMs: def.stepMs,
                            spawnAt: -1, boostUntil: 0,
                            shootAt: now + ENEMY_SHOOT_MS
                        });
                        return true;
                    }
                }
                return false;
            }

            // 蓝蛇开火：朝玩家蛇头的方向射一发，打中扣对应部位的血
            function fireEnemyBullet(en) {
                const from = en.body[0];
                const target = snake[0];
                const dx = target.x - from.x;
                const dy = target.y - from.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < 0.0001 || d > ENEMY_SHOOT_RANGE) return;

                bullets.push({
                    from: 'enemy',
                    x: from.x + 0.5,
                    y: from.y + 0.5,
                    vx: (dx / d) * ENEMY_BULLET_SPEED,
                    vy: (dy / d) * ENEMY_BULLET_SPEED
                });
            }

            function killEnemy(target, now) {
                const i = enemies.indexOf(target);
                if (i === -1) return;
                enemies.splice(i, 1);
                enemyRespawns.push(now + ENEMY_RESPAWN_MS);

                // 不立刻消失：留一具会缩小淡出的尸体，动画放完才爆成战利品
                corpses.push({
                    kind: target.kind,
                    body: target.body,
                    hp: target.hp,
                    dir: target.dir,
                    diedAt: now,
                    lootAt: now + DEATH_ANIM_MS
                });
            }

            function dropIndexAt(x, y) {
                for (let i = 0; i < drops.length; i++) {
                    if (drops[i].x === x && drops[i].y === y) return i;
                }
                return -1;
            }

            // 尸体各部分化作战利品：一半加身长，一半加货币
            function dropLoot(body, now) {
                for (let i = 0; i < body.length; i++) {
                    const c = body[i];
                    if (c.x < 0 || c.y < 0 || c.x >= COLS || c.y >= ROWS) continue;
                    if (dropIndexAt(c.x, c.y) !== -1) continue;
                    if (occupiedByPlayer(c.x, c.y) || occupiedByTurret(c.x, c.y)) continue;
                    if (enemyAt(c.x, c.y, null)) continue;

                    drops.push({
                        x: c.x,
                        y: c.y,
                        kind: (i % 2 === 0) ? 'len' : 'coin',
                        expireAt: now + DROP_LIFE_MS
                    });
                }
            }

            // 敌人换步长：按比例缩放已累积的时间，动画进度不会跳
            function setEnemyStepMs(en, next) {
                if (next === en.stepMs) return;
                en.acc = en.acc * (next / en.stepMs);
                en.stepMs = next;
            }

            // 到期的补位 + 难度上来了就补新蛇
            function updateEnemySpawns(now) {
                for (let i = enemyRespawns.length - 1; i >= 0; i--) {
                    if (now < enemyRespawns[i]) continue;
                    enemyRespawns.splice(i, 1);
                    if (!spawnEnemy(now)) enemyRespawns.push(now + 1000);   // 没地方放，过会儿再试
                }

                const want = enemyTargetCount(now);
                while (enemies.length + enemyRespawns.length < want) {
                    if (!spawnEnemy(now)) break;
                }
            }

            function stepEnemy(self, now) {
                // self.dir 在上一步落子后就定好了，所以蛇头动画的终点就是这里的落点，
                // 转弯时不会出现「头已经伸到 A 格、逻辑却走到 B 格」的瞬移
                const head = cell(self.body[0].x + self.dir.x, self.body[0].y + self.dir.y);

                // 撞墙 / 咬到自己 / 撞到玩家、炮塔或别的敌人，都算它阵亡
                if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
                    ownBodyAt(self.body, head.x, head.y, true) ||
                    occupiedByPlayer(head.x, head.y) ||
                    occupiedByTurret(head.x, head.y) ||
                    enemyAt(head.x, head.y, self)) {
                    killEnemy(self, now);
                    return;
                }

                const eatIdx = appleIndexAt(head.x, head.y);
                const willEat = eatIdx !== -1;
                const sp = powerUps.speed;

                self.body.unshift(head);
                if (willEat) {
                    self.hp.push(SEGMENT_HP);   // 变长时尾巴补一格血
                    apples.splice(eatIdx, 1);
                    spawnApple();               // 苹果被它抢走了，补一个新的
                } else {
                    self.body.pop();
                }

                // 敌人也会抢加速道具
                if (sp && head.x === sp.x && head.y === sp.y) {
                    powerUps.speed = null;
                    powerRespawnAt.speed = now + POWER_DEFS.speed.respawnMs;
                    self.boostUntil = now + SPEED_MS;
                    setEnemyStepMs(self, self.baseStepMs * SPEED_FACTOR);
                }

                // 落子之后再决定下一步往哪拐，下一段动画才能提前知道方向
                self.dir = enemyChooseDir(self);
            }

            function syncEnemyHud(now) {
                if (state !== 'running') {
                    enemyTagEl.hidden = true;
                    return;
                }
                enemyLeftEl.textContent = enemies.length + '/' + enemyTargetCount(now);
                enemyTagEl.hidden = false;
            }

            // ------------------------------ 炮塔 ------------------------------
            function occupiedByTurret(x, y) {
                for (let i = 0; i < turrets.length; i++) {
                    if (turrets[i].x === x && turrets[i].y === y) return true;
                }
                return false;
            }

            function canBuild() {
                return state === 'running' &&
                    snake.length >= TURRET_MIN_LEN &&
                    turrets.length < TURRET_MAX &&
                    coins >= TURRET_COIN_COST;
            }

            // 从尾巴截下 TURRET_COST 节，塔就建在被截掉的尾尖那一格
            function buildTurret() {
                if (!canBuild()) return false;

                const spot = snake[snake.length - 1];
                snake.length -= TURRET_COST;
                snakeHp.length = snake.length;
                coins -= TURRET_COIN_COST;
                syncHud();
                turrets.push({ x: spot.x, y: spot.y, cooldownUntil: 0 });
                return true;
            }

            // 画炮管用：最近的敌人（不看射程）
            function nearestEnemyHead(x, y) {
                let best = null;
                let bestD = Infinity;
                for (let i = 0; i < enemies.length; i++) {
                    const h = enemies[i].body[0];
                    const dx = h.x - x;
                    const dy = h.y - y;
                    const d = dx * dx + dy * dy;
                    if (d < bestD) {
                        bestD = d;
                        best = h;
                    }
                }
                return best;
            }

            // 射程内最近的敌人蛇头，没有就返回 null
            function turretTarget(t) {
                let best = null;
                let bestD = TURRET_RANGE + 1;
                for (let i = 0; i < enemies.length; i++) {
                    const h = enemies[i].body[0];
                    const dx = h.x - t.x;
                    const dy = h.y - t.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d <= TURRET_RANGE && d < bestD) {
                        bestD = d;
                        best = h;
                    }
                }
                return best ? { x: best.x, y: best.y, d: bestD } : null;
            }

            function updateTurrets(now) {
                if (enemies.length === 0) return;

                for (let i = 0; i < turrets.length; i++) {
                    const t = turrets[i];
                    if (now < t.cooldownUntil) continue;

                    const target = turretTarget(t);
                    if (!target || target.d < 0.0001) continue;

                    t.cooldownUntil = now + TURRET_COOLDOWN;
                    bullets.push({
                        from: 'player',
                        x: t.x + 0.5,
                        y: t.y + 0.5,
                        vx: ((target.x - t.x) / target.d) * BULLET_SPEED,
                        vy: ((target.y - t.y) / target.d) * BULLET_SPEED
                    });
                }
            }

            // 子弹只打敌人，不会误伤玩家
            function updateBullets(dtSec, now) {
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.x += b.vx * dtSec;
                    b.y += b.vy * dtSec;

                    const cx = Math.floor(b.x);
                    const cy = Math.floor(b.y);

                    if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) {
                        bullets.splice(i, 1);
                        continue;
                    }
                    // 玩家的炮塔只打敌人蛇；将来若有敌方子弹，会走 else 分支打玩家
                    if (b.from !== 'enemy') {
                        let hitEnemy = null;
                        let hitIdx = -1;
                        for (let e = 0; e < enemies.length; e++) {
                            const idx = bodyIndexAt(enemies[e].body, cx, cy);
                            if (idx !== -1) {
                                hitEnemy = enemies[e];
                                hitIdx = idx;
                                break;
                            }
                        }
                        if (hitEnemy) {
                            bullets.splice(i, 1);
                            if (damageBody(hitEnemy.body, hitEnemy.hp, hitIdx, now)) killEnemy(hitEnemy, now);
                        }
                    } else {
                        const pIdx = bodyIndexAt(snake, cx, cy);
                        if (pIdx !== -1) {
                            bullets.splice(i, 1);
                            if (damageBody(snake, snakeHp, pIdx, now)) gameOver();
                        }
                    }
                }
            }

            function drawTurrets() {
                for (let i = 0; i < turrets.length; i++) {
                    const t = turrets[i];
                    const cx = cxOf(t);
                    const cy = cyOf(t);
                    const size = CELL * 0.74;

                    ctx.fillStyle = COLOR.turretBase;
                    roundRect(cx - size / 2, cy - size / 2, size, size, size * 0.25);
                    ctx.fill();

                    // 炮管瞄最近的敌人，没敌人就朝上
                    let ang = -Math.PI / 2;
                    const aim = nearestEnemyHead(t.x, t.y);
                    if (aim) ang = Math.atan2(cyOf(aim) - cy, cxOf(aim) - cx);
                    ctx.strokeStyle = COLOR.turretBarrel;
                    ctx.lineWidth = CELL * 0.17;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(cx + Math.cos(ang) * CELL * 0.44, cy + Math.sin(ang) * CELL * 0.44);
                    ctx.stroke();

                    ctx.fillStyle = COLOR.turretCore;
                    ctx.beginPath();
                    ctx.arc(cx, cy, CELL * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawBullets() {
                for (let i = 0; i < bullets.length; i++) {
                    // 敌方子弹换个颜色，一眼能看出该躲哪颗
                    ctx.fillStyle = (bullets[i].from === 'enemy') ? COLOR.enemyBullet : COLOR.bullet;
                    ctx.beginPath();
                    ctx.arc(pxOf(bullets[i].x), pyOf(bullets[i].y), CELL * 0.16, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 身长不够 / 到上限时按钮变灰
            let buildBtnLabel = '';
            function syncBuildBtn() {
                const label = '建塔 · 身长 −' + TURRET_COST + ' · 币 −' + TURRET_COIN_COST +
                    '　' + turrets.length + '/' + TURRET_MAX;
                if (label !== buildBtnLabel) {
                    buildBtnEl.textContent = label;
                    buildBtnLabel = label;
                }
                buildBtnEl.classList.toggle('is-off', !canBuild());
            }

            // ------------------------------ 主循环 ------------------------------
            function frame(now) {
                // 单帧最多按 200ms 计：切后台回来子弹不会瞬移
                const dtSec = Math.max(0, Math.min(now - last, 200)) / 1000;
                nowRef = now;
                if (runStartAt < 0) runStartAt = now;   // 本局计时起点
                if (playerSpawnAt < 0) playerSpawnAt = now;

                if (state === 'running') {
                    // 玩家请求建造炮塔（空格 / 屏幕按钮）
                    if (buildRequested) {
                        buildRequested = false;
                        buildTurret();
                    }

                    // 加速到期
                    if (boostUntil && now >= boostUntil) {
                        boostUntil = 0;
                        setStepMs(STEP_MS);
                    }

                    // 道具重生
                    for (let i = 0; i < POWER_KINDS.length; i++) {
                        const kind = POWER_KINDS[i];
                        if (!powerUps[kind] && powerRespawnAt[kind] && now >= powerRespawnAt[kind]) {
                            powerRespawnAt[kind] = 0;
                            spawnPowerUp(kind);
                        }
                    }

                    // 每帧最多累积一个步长：切到后台再回来不会瞬间追帧
                    acc += Math.min(now - last, stepMs);
                    while (acc >= stepMs && state === 'running') {
                        acc -= stepMs;
                        step(now);
                    }

                    // 苹果按难度补足
                    const wantApples = appleTargetCount(now);
                    while (apples.length < wantApples) {
                        if (!spawnApple()) break;
                    }

                    // 敌人蛇：补位 / 难度爬升 / 各自按自己的节奏走
                    updateEnemySpawns(now);
                    const list = enemies.slice();
                    for (let i = 0; i < list.length; i++) {
                        const en = list[i];
                        if (en.spawnAt < 0) en.spawnAt = now;

                        // 加速到期
                        if (en.boostUntil && now >= en.boostUntil) {
                            en.boostUntil = 0;
                            setEnemyStepMs(en, en.baseStepMs);
                        }

                        // 蓝蛇：到点就开火
                        if (enemyDef(en).shoots && now >= en.shootAt) {
                            en.shootAt = now + ENEMY_SHOOT_MS;
                            fireEnemyBullet(en);
                        }

                        en.acc += Math.min(now - last, en.stepMs);
                        while (en.acc >= en.stepMs && state === 'running' &&
                               enemies.indexOf(en) !== -1) {
                            en.acc -= en.stepMs;
                            stepEnemy(en, now);
                        }
                    }

                    // 炮塔开火 + 子弹飞行
                    updateTurrets(now);
                    updateBullets(dtSec, now);

                    // 掉落物放久了会消失
                    for (let i = drops.length - 1; i >= 0; i--) {
                        if (now >= drops[i].expireAt) drops.splice(i, 1);
                    }

                    // 阵亡动画放完 -> 尸体爆成战利品
                    for (let i = corpses.length - 1; i >= 0; i--) {
                        if (now >= corpses[i].lootAt) {
                            dropLoot(corpses[i].body, now);
                            corpses.splice(i, 1);
                        }
                    }

                    // 蛇身血量随时间线性回复：HP_REGEN_MS 毫秒回 1 点
                    const regen = (dtSec * 1000) / HP_REGEN_MS;
                    for (let i = 0; i < snakeHp.length; i++) {
                        snakeHp[i] = Math.min(SEGMENT_HP, snakeHp[i] + regen);
                    }
                    for (let e = 0; e < enemies.length; e++) {
                        const hp = enemies[e].hp;
                        for (let i = 0; i < hp.length; i++) {
                            hp[i] = Math.min(SEGMENT_HP, hp[i] + regen);
                        }
                    }
                }
                last = now;

                // 场地放大动画：画布尺寸和画面偏移一起缓入缓出
                if (widenStartAt) {
                    const t = Math.min(1, (now - widenStartAt) / WIDEN_ANIM_MS);
                    applyWidenFrame(ease(t));
                    if (t >= 1) {
                        widenStartAt = 0;
                        resizeCanvas();   // 收尾对齐到精确尺寸，避免取整误差累积
                    }
                }

                syncBoostHud(now);
                syncEnemyHud(now);
                syncBuildBtn();
                render();
                requestAnimationFrame(frame);
            }

            // ------------------------------ 输入 ------------------------------
            function onKeyDown(ev) {
                const key = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;

                if (KEYMAP[key]) {
                    ev.preventDefault();
                    turn(KEYMAP[key]);
                    return;
                }

                // 空格：游戏中 = 建塔，结束后 = 重开
                if (key === ' ') {
                    ev.preventDefault();
                    if (state === 'over') start();
                    else buildRequested = true;
                    return;
                }

                if (key === 'Enter') {
                    ev.preventDefault();
                    if (state === 'over') start();
                }
            }

            document.addEventListener('keydown', onKeyDown);

            Array.prototype.forEach.call(
                document.querySelectorAll('.operate .btn'),
                function (btn) {
                    btn.addEventListener('click', function () {
                        turn(btn.getAttribute('data-dir'));
                    });
                }
            );

            buildBtnEl.addEventListener('click', function () {
                buildRequested = true;
            });

            // 手机上结束后点棋盘即可重开
            canvas.addEventListener('click', function () {
                if (state === 'over') start();
            });

            // ------------------------------ 启动 ------------------------------
            start();
            requestAnimationFrame(function (now) {
                last = now;   // 首帧不计时，避免刚开局就跳步
                frame(now);
            });
        })();
    </script>
</body>

</html>
