[package]
name = "snake-army"
version = "1.0.0"
description = "贪吃蛇 · Canvas 版（单机 / 本地双人 / P2P 联机）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "snake_army_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
