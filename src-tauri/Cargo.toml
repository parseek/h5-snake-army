[package]
name = "snake-army"
version = "0.2.1"
description = "贪吃蛇 · Canvas 版（单机 / 本地双人 / P2P 联机）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "snake_army_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 这两个已经在 Tauri 的依赖树里了，加进来不会多编译什么
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
